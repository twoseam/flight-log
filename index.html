<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIGHT LOG 2016–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#000;--dim:#999;--hair:#E5E5E5;--bg:#FFF;--grat:#F2F2F2;--ring:#E0E0E0;--faint:#CCC;--hover:#F2F2F2;
  --mono:"Fragment Mono",ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);transition:background .2s,color .2s;font-family:var(--mono);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 96px}

header{padding:64px 0 0}
h1{font-size:12px;font-weight:400;letter-spacing:.22em}
.board{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid var(--ink)}
.cell{padding:14px 12px 22px 0}
.k{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.v{font-size:38px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}

.filters{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-top:1px solid var(--ink);z-index:1100}
.fgroup{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink);background:var(--bg);border:1px solid var(--ink);
  padding:4px 12px;cursor:pointer;transition:background .1s}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

section{margin-top:56px}
h2{font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--dim);margin-bottom:18px}
h2 b{color:var(--ink);font-weight:400}
svg text{font-family:var(--mono)}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:56px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;font-weight:400;letter-spacing:.14em;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--ink)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--hair);vertical-align:top}
td.rt{color:var(--dim)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--ink);color:var(--bg)}
tbody tr.sel td.rt{color:var(--bg);opacity:.7}
.empty{padding:28px 0;color:var(--dim)}
footer{margin-top:72px;color:var(--dim);font-size:11px}
@media(max-width:760px){
  .board{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr;gap:44px}
  td:nth-child(4),th:nth-child(4){display:none}
  header{padding-top:40px}.v{font-size:32px}
}
html[data-theme="dark"]{--ink:#EDEDED;--dim:#8A8A8A;--hair:#262626;--bg:#0E0E0E;--grat:#1A1A1A;--ring:#242424;--faint:#4A4A4A;--hover:#1E1E1E}
#themeBtn{position:absolute;top:0;right:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--ink);background:var(--bg);border:1px solid var(--ink);padding:4px 12px;cursor:pointer}
#themeBtn:hover{background:var(--hover)}
.filters{padding-right:100px}
#clearBtn{position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);
  background:var(--bg);border:1px solid var(--dim);padding:4px 12px;cursor:pointer;display:none}
#clearBtn:hover{color:var(--ink);border-color:var(--ink)}
#clearBtn.show{display:block}
header{position:relative}
#map{border:1px solid var(--hair);background:var(--bg);position:relative;z-index:0;isolation:isolate}
.leaflet-container{font-family:var(--mono);font-size:11px;background:var(--bg)}
.leaflet-tooltip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:0;box-shadow:none}
.leaflet-tooltip:before{display:none}
.leaflet-control-zoom a{border-radius:0!important;font-family:var(--mono);
  background:var(--bg)!important;color:var(--ink)!important;border-color:var(--ink)!important}
.leaflet-control-attribution{display:none}
th:hover{color:var(--ink)}
th.sorted{color:var(--ink)}
th .dir{font-size:9px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>FLIGHT LOG 2016–2026 / MCI</h1>
  <button id="themeBtn" aria-label="Toggle dark mode">DARK</button>
  <div class="board" id="board"></div>
</header>

<div class="filters"><button id="clearBtn" aria-label="Clear all filters">CLEAR ×</button>
  <div class="fgroup" id="yearChips"></div>
  <div class="fgroup" id="alChips" style="margin-top:6px"></div>
</div>

<section>
  <h2>MILES / YEAR <b id="mtag"></b></h2>
  <svg id="yearChart" width="100%" height="200"></svg>
</section>

<section>
  <div class="charts">
    <div><h2>DESTINATIONS / TRIPS</h2><svg id="destChart" width="100%" height="260"></svg></div>
    <div><h2>AIRLINE / SEGMENTS</h2><svg id="alChart" width="100%" height="260"></svg></div>
  </div>
</section>

<section>
  <h2>ROUTES / DRAG TO PAN · SCROLL TO ZOOM</h2>
  <div id="map" style="height:520px"></div>
</section>

<section>
  <h2>LOG <b id="ttag"></b></h2>
  <table>
    <thead><tr>
  <th data-k="date">WHEN<span class="dir"></span></th>
  <th data-k="name">TRIP<span class="dir"></span></th>
  <th data-k="al">AIRLINE<span class="dir"></span></th>
  <th data-k="rt">ROUTING<span class="dir"></span></th>
  <th class="num" data-k="n">LEGS<span class="dir"></span></th>
  <th class="num" data-k="mi">MI<span class="dir"></span></th>
</tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">NO MATCHES</div>
</section>

<footer>SOURCE: GMAIL RECEIPTS. GREAT-CIRCLE ESTIMATES. UNROUTED TRIPS 2017/2019–20 EXCLUDED. JUL 2026.</footer>
</div>

    b.onclick=()=>{
      if(v==="All"){set.clear();}
      else{set.has(v)?set.delete(v):set.add(v);}
      syncChips();render();
    };
    el.appendChild(b);
  });
}
function syncChips(){
  document.querySelectorAll("#yearChips .chip").forEach(c=>{
    const v=c.dataset.v;
    c.classList.toggle("on", v==="All"?fYears.size===0:fYears.has(Number(v)));
  });
  document.querySelectorAll("#alChips .chip").forEach(c=>{
    const v=c.dataset.v;
    c.classList.toggle("on", v==="All"?fAls.size===0:fAls.has(v));
  });
  document.getElementById("clearBtn").classList.toggle("show",fYears.size>0||fAls.size>0);
}
chips(document.getElementById("yearChips"),YEARS,fYears);
chips(document.getElementById("alChips"),ALGROUPS,fAls);
document.getElementById("clearBtn").onclick=()=>{fYears.clear();fAls.clear();syncChips();render();};
syncChips();

function board(ts){
  const mi=ts.reduce((s,t)=>s+t.mi,0),legs=ts.reduce((s,t)=>s+t.n,0);
  const dests=new Set();ts.forEach(t=>t.segs.forEach(s=>{if(s[1]!=="MCI")dests.add(s[1]);}));
  document.getElementById("board").innerHTML=`
   <div class="cell"><div class="k">Miles</div><div class="v">${fmt(mi)}</div></div>
   <div class="cell"><div class="k">Trips</div><div class="v">${ts.length}</div></div>
   <div class="cell"><div class="k">Legs</div><div class="v">${legs}</div></div>
   <div class="cell"><div class="k">Airports</div><div class="v">${dests.size}</div></div>`;
}

function yearChart(ts){
  const svg=document.getElementById("yearChart");
  const W=svg.clientWidth||912,H=220,P={l:0,r:0,t:22,b:24};
  const yrs=YEARS.slice(1);
  const by={};yrs.forEach(y=>by[y]=0);ts.forEach(t=>by[t.y]+=t.mi);
  const max=Math.max(...Object.values(by),1),bw=(W-P.l-P.r)/yrs.length;
  let s="";
  yrs.forEach((y,i)=>{
    const h=(by[y]/max)*(H-P.t-P.b),x=P.l+i*bw+bw*0.18,w=bw*0.64,ty=H-P.b-h;
    const on=fYears.size===0||fYears.has(y);
    s+=`<rect x="${x}" y="${ty}" width="${w}" height="${Math.max(h,by[y]?1:0)}" fill="${on?INK:FAINT}"/>`;
    if(by[y]>0)s+=`<text x="${x+w/2}" y="${ty-7}" fill="${DIM}" font-size="11" text-anchor="middle">${(by[y]/1000).toFixed(1)}k</text>`;
    s+=`<text x="${x+w/2}" y="${H-6}" fill="${DIM}" font-size="11" text-anchor="middle">’${String(y).slice(2)}</text>`;
  });
  svg.innerHTML=s;
  document.getElementById("mtag").textContent=fmt(ts.reduce((a,t)=>a+t.mi,0))+" mi";
}

function destChart(ts){
  const svg=document.getElementById("destChart");
  const W=svg.clientWidth||430,H=280;
  const cnt={};
  ts.forEach(t=>{const seen=new Set();t.segs.forEach(s=>{if(s[1]!=="MCI")seen.add(s[1]);});
    seen.forEach(d=>cnt[d]=(cnt[d]||0)+1);});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...top.map(d=>d[1]),1),rh=H/Math.max(top.length,1);
  let s="";
  top.forEach(([code,c],i)=>{
    const y=i*rh+rh*0.22,h=Math.min(rh*0.5,14),w=(c/max)*(W-150);
    s+=`<text x="0" y="${y+h*0.85}" fill="${INK}" font-size="12">${AIRPORTS[code].city}</text>`;
    s+=`<rect x="112" y="${y}" width="${Math.max(w,2)}" height="${h}" fill="${INK}"/>`;
    s+=`<text x="${118+Math.max(w,2)}" y="${y+h*0.85}" fill="${DIM}" font-size="12">${c}</text>`;
  });
  svg.innerHTML=s||`<text x="0" y="20" fill="${DIM}" font-size="12">No data</text>`;
}

function alChart(ts){
  const svg=document.getElementById("alChart");
  const W=svg.clientWidth||430,H=280;
  const cnt={};
  ts.forEach(t=>{ALGROUPS.slice(1).forEach(g=>{if(t.al.includes(g))cnt[g]=(cnt[g]||0)+t.n;});});
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0)||1;
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const rh=34;let s="";
  rows.forEach(([g,c],i)=>{
    const y=i*rh+8,w=(c/tot)*(W-150);
    s+=`<text x="0" y="${y+11}" fill="${INK}" font-size="12">${g}</text>`;
    s+=`<rect x="112" y="${y}" width="${Math.max(w,2)}" height="14" fill="${INK}" />`;
    s+=`<text x="${118+Math.max(w,2)}" y="${y+11}" fill="${DIM}" font-size="12">${c} · ${Math.round(c/tot*100)}%</text>`;
  });
  svg.innerHTML=rows.length?s:`<text x="0" y="20" fill="${DIM}" font-size="12">No data</text>`;
}

let LMAP=null,LLAND=null,LSTATES=null,LLAYER=null;
let SELECTED=null;
function landStyle(dark){
  return {fillColor:dark?"#1C1C1C":"#F4F4F4",fillOpacity:1,
          color:dark?"#333":"#D8D8D8",weight:1,interactive:false};
}
function stateStyle(dark){
  return {fillOpacity:0,color:dark?"#2A2A2A":"#E5E5E5",weight:.6,interactive:false};
}
function arcPts(a,b){
  const pts=[],n=48;
  for(let i=0;i<=n;i++){
    const t=i/n;
    const lat=a.lat+(b.lat-a.lat)*t, lon=a.lon+(b.lon-a.lon)*t;
    const bulge=Math.sin(Math.PI*t)*Math.min(Math.hypot(b.lat-a.lat,b.lon-a.lon)*0.12,6);
    pts.push([lat+bulge,lon]);
  }
  return pts;
}
function mapDraw(ts){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  if(!LMAP){
    LMAP=L.map("map",{scrollWheelZoom:true,zoomSnap:.5,attributionControl:false,
      minZoom:1.5,maxZoom:8,maxBounds:[[-60,-200],[80,200]]}).setView([41,-60],3);
    LLAND=L.geoJSON(LAND,{style:landStyle(dark)}).addTo(LMAP);
    LSTATES=L.geoJSON(STATES,{style:stateStyle(dark)}).addTo(LMAP);
    LLAYER=L.layerGroup().addTo(LMAP);
  }else{
    LLAND.setStyle(landStyle(dark));
    LSTATES.setStyle(stateStyle(dark));
    LLAYER.clearLayers();
  }
  const ink=dark?"#EDEDED":"#000",bg=dark?"#0E0E0E":"#FFF";
  const fade=SELECTED?.3:1;
  const rw={},visits={};
  ts.forEach(t=>t.segs.forEach(sg=>{
    const k=[sg[0],sg[1]].sort().join("-");rw[k]=(rw[k]||0)+1;
    const d=sg[1]!=="MCI"?sg[1]:sg[0];if(d!=="MCI")visits[d]=(visits[d]||0)+1;}));
  Object.entries(rw).forEach(([rt,w])=>{
    const [a,b]=rt.split("-");
    L.polyline(arcPts(AIRPORTS[a],AIRPORTS[b]),{
      color:ink,weight:Math.min(.8+w*.3,3.2),opacity:Math.min(.2+w*.08,.6)*fade,interactive:false
    }).addTo(LLAYER);
  });
  const pts=[[39.2976,-94.7139]];
  Object.entries(visits).forEach(([code,c])=>{
    const A=AIRPORTS[code];pts.push([A.lat,A.lon]);
    L.circleMarker([A.lat,A.lon],{
      radius:4+Math.min(c,8),color:ink,weight:1.4,fillColor:bg,fillOpacity:fade,opacity:fade
    }).bindTooltip(`${code} · ${A.city.toUpperCase()} · ${c} VISIT${c>1?"S":""}`,
      {direction:"top",offset:[0,-6]}).addTo(LLAYER);
  });
  L.circleMarker([39.2976,-94.7139],{radius:6,color:ink,weight:1,fillColor:ink,fillOpacity:1})
    .bindTooltip("MCI · KANSAS CITY · HOME",{direction:"top",offset:[0,-6]}).addTo(LLAYER);
  let boundsPts=pts;
  if(SELECTED&&ts.includes(SELECTED)){
    const selCodes=new Set();
    SELECTED.segs.forEach(([a,b])=>{selCodes.add(a);selCodes.add(b);
      L.polyline(arcPts(AIRPORTS[a],AIRPORTS[b]),{color:ink,weight:3,opacity:1,interactive:false}).addTo(LLAYER);
    });
    selCodes.forEach(code=>{
      const A=AIRPORTS[code];
      L.circleMarker([A.lat,A.lon],{radius:6,color:ink,weight:2,fillColor:bg,fillOpacity:1,opacity:1})
        .bindTooltip(`${code} · ${A.city.toUpperCase()}`,{direction:"top",offset:[0,-6]}).addTo(LLAYER);
    });
    boundsPts=[...selCodes].map(code=>[AIRPORTS[code].lat,AIRPORTS[code].lon]);
  }
  if(boundsPts.length>1)LMAP.fitBounds(L.latLngBounds(boundsPts).pad(SELECTED?0.35:0.12));
}
function table(ts){
  const tb=document.getElementById("tbody");
  const sorted=[...ts].sort((a,b)=>{
    const va=a[sortKey],vb=b[sortKey];
    const c=(typeof va==="number")?va-vb:String(va).localeCompare(String(vb));
    return c*sortDir||b.date-a.date;
  });
  syncSortHeads();
  tb.innerHTML=sorted.map((t,i)=>`<tr data-i="${i}" class="${t===SELECTED?"sel":""}">
    <td>${t.when}</td><td>${t.name}</td><td class="rt">${t.al}</td>
    <td class="rt">${t.rt}</td>
    <td class="num">${t.n}</td><td class="num">${fmt(t.mi)}</td></tr>`).join("");
  tb.querySelectorAll("tr").forEach(tr=>{
    tr.onclick=()=>{
      const t=sorted[Number(tr.dataset.i)];
      SELECTED=(SELECTED===t)?null:t;
      render();
    };
  });
  document.getElementById("empty").style.display=ts.length?"none":"block";
  document.getElementById("ttag").textContent=ts.length+" trips";
}

function render(){
  themeColors();
  const ts=F();
  if(SELECTED&&!ts.includes(SELECTED))SELECTED=null;
  board(ts);yearChart(ts);destChart(ts);alChart(ts);mapDraw(ts);table(ts);
}

const tbtn=document.getElementById("themeBtn");
function setTheme(d){
  document.documentElement.setAttribute("data-theme",d?"dark":"light");
  tbtn.textContent=d?"LIGHT":"DARK";
  render();
}
tbtn.onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")!=="dark");

function boot(){
  precomputeTrips();
  if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)setTheme(true);
  else render();
  window.addEventListener("resize",()=>render());
}
fetch(SHEET_JSON_URL).then(r=>r.text()).then(txt=>{
  const json=JSON.parse(txt.substring(txt.indexOf("{"),txt.lastIndexOf("}")+1));
  const live=rowsToTrips(json.table.rows);
  if(live.length)TRIPS=live;
  boot();
}).catch(()=>boot());
